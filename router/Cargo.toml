[package]
name = "router"
version = "0.1.0"
edition = "2021"
description = "What needs OCR? Which parts of a born-digital PDF page only exist as pixels, routed from the page map of where-are-the-regions."
license = "MIT"

[[bin]]
name = "router-cli"
path = "src/main.rs"

[dependencies]
# The page map: every word, image, path and annotation a page draws, with its box and kind.
regions = { path = "../../where-are-the-regions/regions" }
# Reading the OCR results tools/ocr_crops.py writes, for --merge.
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
